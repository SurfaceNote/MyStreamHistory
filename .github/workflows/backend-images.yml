name: Build & Push Backend Images

on:
  push:
    branches: [ "main" ]
    paths:
      - "Backend/**"
      - "Frontend/**"
      - ".github/workflows/backend-images.yml"
  pull_request:
    paths:
      - "Backend/**"
      - "Frontend/**"
      - ".github/workflows/backend-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: dotnet test Backend/AdminService/MyStreamHistory.AdminService.Tests/MyStreamHistory.AdminService.Tests.csproj -c Release
      - run: dotnet test Backend/ContentService/MyStreamHistory.ContentService.Api.Tests/MyStreamHistory.ContentService.Api.Tests.csproj -c Release
      - run: dotnet test Backend/Community.Tests/MyStreamHistory.Community.Tests.csproj -c Release --filter FullyQualifiedName~CommunityAccessTests
      - run: npm ci
        working-directory: Frontend
      - run: npm run build:admin
        working-directory: Frontend
      - run: npm run test:admin
        working-directory: Frontend
      - run: npm run test:ssr-metrics
        working-directory: Frontend

  build-and-push:
    needs: admin-checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: authservice
            context: Backend
            dockerfile: Backend/AuthService/MyStreamHistory.AuthService.Api/Dockerfile
            image: authservice
          - service: gateway
            context: Backend
            dockerfile: Backend/Gateway/MyStreamHistory.Gateway.Api/Dockerfile
            image: gateway
          - service: contentservice
            context: Backend
            dockerfile: Backend/ContentService/MyStreamHistory.ContentService.Api/Dockerfile
            image: contentservice
          - service: twitchtrackingservice
            context: Backend
            dockerfile: Backend/TwitchTrackingService/MyStreamHistory.TwitchTrackingService.Api/Dockerfile
            image: twitchtrackingservice
          - service: viewerservice
            context: Backend
            dockerfile: Backend/ViewerService/MyStreamHistory.ViewerService.Api/Dockerfile
            image: viewerservice
          - service: adminservice
            context: .
            dockerfile: Backend/AdminService/MyStreamHistory.AdminService.Api/Dockerfile
            image: mystreamhistoryadmin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Timeweb Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TWC_REGISTRY_HOST }}
          username: ${{ secrets.TWC_REGISTRY_USER }}
          password: ${{ secrets.TWC_REGISTRY_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.TWC_REGISTRY_HOST }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
