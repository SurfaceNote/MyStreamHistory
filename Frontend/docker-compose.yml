services:
  mystreamhistoryweb:
    image: ${TWC_REGISTRY_HOST}/mystreamhistoryweb:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt/live/mystreamhistory.com:/etc/letsencrypt/live/mystreamhistory.com:ro
      - /etc/letsencrypt/archive/mystreamhistory.com:/etc/letsencrypt/archive/mystreamhistory.com:ro
      - /etc/letsencrypt/renewal/mystreamhistory.com.conf:/etc/letsencrypt/renewal/mystreamhistory.com.conf:ro
    networks:
      - internalnet
    depends_on:
      mystreamhistoryssr:
        condition: service_healthy

  mystreamhistoryssr:
    image: ${TWC_REGISTRY_HOST}/mystreamhistoryssr:latest
    restart: unless-stopped
    environment:
      CONTENT_API_URL: https://api.mystreamhistory.com
      PORT: "4000"
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
    networks:
      - internalnet

networks:
  internalnet:
    driver: bridge
