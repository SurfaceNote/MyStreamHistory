<header>
    <div class="left-side">
        <div class="logo-menu">
            <div class="logo">
                <a [routerLink]="['/']">
                    <img src="/logo.png" alt="MyStreamHistory logo" /></a>
                <a [routerLink]="['/']">MyStreamHistory</a>
                <span class="alpha-label" title="Alpha version in development">ALPHA</span>
            </div>
        </div>
    </div>
    <nav class="editorial-links" aria-label="Editorial"><a routerLink="/news" routerLinkActive="active">News</a><a routerLink="/reviews" routerLinkActive="active">Reviews</a></nav>
    <div class="auth" [attr.aria-busy]="!authReady">
        <span *ngIf="!authReady" class="auth-placeholder" aria-hidden="true"></span>
        <app-login-component *ngIf="authReady && !isLoggedIn"/>
        <div *ngIf="authReady && isLoggedIn" class="user-menu">
            <div>Hello, <a [routerLink]="['/profile', twitchId]">{{username}}</a></div>
            <button *ngIf="isAdmin" class="admin-btn" (click)="navigateToAdmin()" title="Publications admin">
                <i class="fa fa-shield"></i>
            </button>
            <button class="settings-btn" (click)="navigateToSettings()" title="Settings">
                <i class="fa fa-gear"></i>
            </button>
        </div>
        <button *ngIf="authReady && isLoggedIn" (click)="logout()">Logout</button>
    </div>
</header>
