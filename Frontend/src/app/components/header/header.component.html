<header>
    <div class="left-side">
        <a class="brand" routerLink="/" aria-label="MyStreamHistory home"><img src="/logo.png" alt="" /><span>MyStreamHistory</span></a>
        <span class="alpha-label" title="Alpha version in development">ALPHA</span>
    </div>
    <nav class="editorial-links" aria-label="Main navigation">
        <a routerLink="/news" routerLinkActive="active">News</a>
        <a routerLink="/reviews" routerLinkActive="active">Reviews</a>
        <a *ngIf="authReady && isLoggedIn" routerLink="/analytics/community" routerLinkActive="active">Community</a>
    </nav>
    <div class="auth" [attr.aria-busy]="!authReady">
        <span *ngIf="!authReady" class="auth-placeholder" aria-hidden="true"></span>
        <app-login-component *ngIf="authReady && !isLoggedIn"/>
        <div *ngIf="authReady && isLoggedIn" class="user-menu">
            <a class="profile-link" [routerLink]="['/profile', twitchId]" [title]="username || ''" [attr.aria-label]="'Profile: ' + username">{{username}}</a>
            <button *ngIf="isAdmin" class="icon-btn admin-btn" (click)="navigateToAdmin()" title="Publications admin" aria-label="Publications admin">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/></svg>
            </button>
            <button class="icon-btn settings-btn" (click)="navigateToSettings()" title="Settings" aria-label="Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.3-2 .9L4.3 6 2 10l1.7 1.6v2.3L2 15.5l2.3 4 2.1-.3 2 .9L9 22h5l.6-1.9 2-.9 2.1.3 2.3-4-1.7-1.6v-2.3L21 10l-2.3-4-2.1.2-2-.9L14 3z"/><circle cx="11.5" cy="12.5" r="3"/></svg>
            </button>
        </div>
        <button *ngIf="authReady && isLoggedIn" class="logout-btn" (click)="logout()">Logout</button>
    </div>
</header>
