<div class="sidebar">
  <h2 class="sidebar-title">{{ 'ui.settings' | t }}</h2>
  
  <nav class="sidebar-nav" [attr.aria-label]="'settings.sections' | t">
    <button 
      *ngFor="let section of sections"
      class="sidebar-item"
      [class.active]="section.id === activeSection"
      [class.disabled]="section.disabled"
      [disabled]="section.disabled"
      [attr.aria-current]="section.id === activeSection ? 'page' : null"
      (click)="selectSection(section.id, section.disabled)">
      <i class="fa" [ngClass]="section.icon"></i>
      <span>{{ section.label | t }}</span>
      <span *ngIf="section.disabled" class="badge">{{ 'common.inDevelopment' | t }}</span>
    </button>
  </nav>
</div>
