<section class="overlay-settings">
  <h2>{{ 'settings.overlayTitle' | t }}</h2>
  <p>{{ 'settings.overlayDescription' | t }}</p>

  @if (overlayUrl; as url) {
    <label for="overlay-url">{{ 'settings.browserSourceUrl' | t }}</label>
    <div class="link-row">
      <input id="overlay-url" type="text" [value]="url" readonly (click)="$any($event.target).select()" />
      <button type="button" (click)="copyLink()">{{ 'settings.copyLink' | t }}</button>
    </div>
    @if (copyStatus) { <p class="copy-status" role="status">{{ copyStatus }}</p> }
    <a [href]="url" target="_blank" rel="noopener noreferrer">{{ 'settings.openPreview' | t }}</a>
    <p class="hint">{{ 'settings.overlaySize' | t }}</p>
  } @else {
    <p class="error">{{ 'settings.noTwitchId' | t }}</p>
  }
</section>
