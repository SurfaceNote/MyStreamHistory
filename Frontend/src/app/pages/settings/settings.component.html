<div class="settings-container">
  <app-settings-sidebar 
    [activeSection]="activeSection" 
    (sectionChange)="onSectionChange($event)">
  </app-settings-sidebar>
  
  <div class="settings-content">
    <app-profile-settings *ngIf="activeSection === 'profile'"></app-profile-settings>
    <app-playthrough-settings *ngIf="activeSection === 'playthroughs'"></app-playthrough-settings>
    <app-overlay-settings *ngIf="activeSection === 'overlay'"></app-overlay-settings>
    
    <div *ngIf="activeSection !== 'profile' && activeSection !== 'playthroughs' && activeSection !== 'overlay'" class="in-development">
      <h2>{{ 'common.inDevelopment' | t }}</h2>
      <p>{{ 'common.comingSoon' | t }}</p>
    </div>
  </div>
</div>
