# Include in the existing web nginx configuration. Replace certificate paths if needed.
# If nginx runs in Docker, attach it to the admin stack's network and use admin:8080
# instead of 127.0.0.1:4080. The loopback upstream below is for host nginx.
server {
    listen 80;
    server_name admin.mystreamhistory.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://admin.mystreamhistory.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name admin.mystreamhistory.com;
    ssl_certificate /etc/letsencrypt/live/admin.mystreamhistory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mystreamhistory.com/privkey.pem;
    client_max_body_size 20m;
    location ^~ /internal/ { return 404; }
    location ^~ /health/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:4080;
        proxy_set_header Host admin.mystreamhistory.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 125s;
    }
}
