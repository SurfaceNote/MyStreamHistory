global:
  scrape_interval: 15s
  scrape_timeout: 10s
scrape_configs:
  - job_name: msh-admin
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["admin:8080"]
  - job_name: msh-ssr
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["mystreamhistoryssr:4000"]
  # Add private-network gateway/content targets here after arranging connectivity.
  # Do not expose /internal/metrics publicly to make scraping convenient.
